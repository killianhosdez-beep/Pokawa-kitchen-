name: Validate Pokawa Kitchen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs))
            .map(([, , code]) => code.trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((code, index) => {
            const file = `/tmp/pokawa-inline-${index + 1}.js`;
            fs.writeFileSync(file, code);
            require('node:child_process').execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Validated ${scripts.length} inline script(s).`);
          NODE

      - name: Check login and access requirements
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            ['employeeLoginForm', 'single shared login form'],
            ['Connexion rapide · Application développement', 'developer quick-login button'],
            ['newEmployeeRole', 'account access selector'],
            ['manager_simple', 'simple manager role'],
            ['manager_advanced', 'advanced manager role'],
            ['hasListManagement', 'manager list permission'],
            ['hasAdvancedManagement', 'advanced manager permission'],
            ['body.kitchen-mode .login-screen{display:grid!important}', 'shared tablet login screen'],
          ];
          for (const [value, label] of required) {
            if (!html.includes(value)) throw new Error(`Missing ${label}`);
          }
          if (html.includes('id="managerLoginForm"')) {
            throw new Error('Obsolete separate manager login form is still present');
          }
          for (const file of [
            'supabase/functions/employee-pin-login/index.ts',
            'supabase/functions/admin-create-employee/index.ts',
            'supabase/functions/set-employee-pin/index.ts',
            'supabase/functions/update-account-access/index.ts',
            'supabase/migrations/20261120_account_access_levels.sql',
            'supabase/migrations/20261121_employee_pin_fingerprint.sql',
          ]) {
            if (!fs.existsSync(file)) throw new Error(`Missing backend file: ${file}`);
          }
          console.log('Login, roles, tablet route and backend files verified.');
          NODE
