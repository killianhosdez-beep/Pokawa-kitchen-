name: Validate Pokawa Kitchen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs))
            .map(([, , code]) => code.trim())
            .filter(Boolean);
          if (!scripts.length) throw new Error('No inline JavaScript found');
          scripts.forEach((code, index) => {
            const file = `/tmp/pokawa-inline-${index + 1}.js`;
            fs.writeFileSync(file, code);
            require('node:child_process').execFileSync(process.execPath, ['--check', file], { stdio: 'inherit' });
          });
          console.log(`Validated ${scripts.length} inline script(s).`);
          NODE
