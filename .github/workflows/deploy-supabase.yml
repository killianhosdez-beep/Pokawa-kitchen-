name: Deploy Pokawa Kitchen backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

permissions:
  contents: read

concurrency:
  group: pokawa-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: kweckmiczarcspuzchzo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend deployment is waiting for the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Supabase CLI
        if: steps.credentials.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: steps.credentials.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        if: steps.credentials.outputs.configured == 'true'
        run: supabase db push --linked --yes

      - name: Deploy employee PIN login
        if: steps.credentials.outputs.configured == 'true'
        run: supabase functions deploy employee-pin-login --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy account creation
        if: steps.credentials.outputs.configured == 'true'
        run: supabase functions deploy admin-create-employee --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy PIN update
        if: steps.credentials.outputs.configured == 'true'
        run: supabase functions deploy set-employee-pin --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy account access management
        if: steps.credentials.outputs.configured == 'true'
        run: supabase functions deploy update-account-access --project-ref "$SUPABASE_PROJECT_ID"

      - name: Report pending setup
        if: steps.credentials.outputs.configured != 'true'
        run: |
          echo "No deployment was attempted. Add the two Supabase secrets to this GitHub repository, then run this workflow again."
